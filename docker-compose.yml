name: mekamb-download-manager

services:
  download-manager:
    build: .
    container_name: mekamb-download-manager
    restart: unless-stopped
    labels:
      # Subdomena w Traefiku: http://downloader.home (DOMAIN=.home z docker/proxy)
      subdomain: downloader
    networks: [default, proxy]
    environment:
      - TZ=Europe/Warsaw
      # Login + haslo do web UI (porownywane basic authem)
      - AUTH_USER=${AUTH_USER:-lofis}
      - AUTH_PASS=${AUTH_PASS:?set AUTH_PASS in .env}
      # true = odrzuca URL-e prowadzace do IP prywatnych/LAN (SSRF)
      - BLOCK_PRIVATE_IPS=${BLOCK_PRIVATE_IPS:-false}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
      # Wrapper qBittorrent: API contenera qbittorrent-filmy (ta sama siec proxy).
      # Nasze pobierania respektuja aktualny limit DL tego klienta (qbt-speed-schedule.sh),
      # a zakladka "qBittorrent" pozwala patrzec/pauzowac/addowac torrenty.
      # Puste QBT_PASS = integracja wylaczona.
      - QBT_API_URL=${QBT_API_URL:-http://qbittorrent-filmy:8081/api/v2}
      - QBT_USER=${QBT_USER:-admin}
      - QBT_PASS=${QBT_PASS:-}
      # Powiadomienia push na telefon przez wlasny ntfy (kontener na sieci proxy,
      # DNS: "ntfy"). Fire-and-forget po zakonczeniu/porazce pobierania.
      # Serwer ma login enable -> potrzebne NTFY_USER/NTFY_PASS z prawem zapisu
      # na temat. Domyślnie temat "serwer" (telefon juz go czyta; patrz
      # ~/docker/ntfy/credentials.txt). Puste NTFY_TOPIC = wylaczone.
      - NTFY_URL=${NTFY_URL:-http://ntfy}
      - NTFY_TOPIC=${NTFY_TOPIC:-serwer}
      - NTFY_USER=${NTFY_USER:-admin}
      - NTFY_PASS=${NTFY_PASS:-}
    ports:
      # Bezposredni dostep z LAN (opcjonalny, obok subdomeny)
      - "${DM_HOST_PORT:-3000}:3000"
    volumes:
      # Root dir na hoście: pliki leza w /vg_storage/download-mgr/<destination>
      - /vg_storage/download-mgr:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true   # siec Traefika z docker/proxy (pattern ten sam jak arr/*)
