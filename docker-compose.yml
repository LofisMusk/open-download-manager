name: open-download-manager

services:
  download-manager:
    build: .
    container_name: open-download-manager
    restart: unless-stopped
    labels:
      # Optional Traefik subdomain (e.g. http://downloader.example.com);
      # remove if you don't use this pattern
      subdomain: downloader
    networks: [default, proxy]
    environment:
      # Login + password for the web UI (Basic auth)
      - AUTH_USER=${AUTH_USER:-admin}
      - AUTH_PASS=${AUTH_PASS:?set AUTH_PASS in .env}
      # true = reject URLs that resolve to private/LAN IPs (SSRF protection);
      # set false if you download from a NAS on your LAN
      - BLOCK_PRIVATE_IPS=${BLOCK_PRIVATE_IPS:-false}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
      # qBittorrent wrapper: point QBT_API_URL at the WebUI API of your
      # qBittorrent container (reachable by name on the shared network).
      # Own downloads then respect that client's current DL limit, and the
      # "qBittorrent" tab lets you browse/pause/add torrents. Empty QBT_PASS = off.
      - QBT_API_URL=${QBT_API_URL:-http://qbittorrent:8081/api/v2}
      - QBT_USER=${QBT_USER:-admin}
      - QBT_PASS=${QBT_PASS:-}
      # Push notifications via ntfy (same Docker network -> reach it by name).
      # Fire-and-forget after a download finishes or fails. If your ntfy server
      # requires login, set NTFY_USER/NTFY_PASS. Empty NTFY_TOPIC = off.
      - NTFY_URL=${NTFY_URL:-http://ntfy}
      - NTFY_TOPIC=${NTFY_TOPIC:-downloads}
      - NTFY_USER=${NTFY_USER:-admin}
      - NTFY_PASS=${NTFY_PASS:-}
    ports:
      # Direct LAN access (optional, in addition to any subdomain)
      - "${DM_HOST_PORT:-3000}:3000"
    volumes:
      # Destination root on the host: files land in ./downloads/<destination>
      - ./downloads:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true   # shared reverse-proxy network (remove if you don't use one)
