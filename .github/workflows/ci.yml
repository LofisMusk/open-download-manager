name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check server.js
      - run: npm test

  docker:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute short sha
        id: image
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/lofismusk/open-download-manager:${{ steps.image.outputs.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/lofismusk/open-download-manager:{0}', github.ref_name) || '' }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/lofismusk/open-download-manager:latest' || '' }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
